model:
  name: "google/gemma-3-4b-it"
  device_map: "auto"
  attention_implementation: "eager"
  torch_dtype: "float16"
  trust_remote_code: true
  
tokenizer:
  padding_side: "right"
  add_eos_token: true
  
generation:
  max_new_tokens: 1200
  temperature: 0.7
  top_p: 0.9
  do_sample: true
  use_cache: true